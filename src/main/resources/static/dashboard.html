<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TripSplit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-content">
        <div class="page-header">
            <button class="mobile-menu-btn">☰</button>
            <h1 class="page-title">Dashboard</h1>
        </div>

        <div class="card-grid">
            <div class="card">
                <div class="card-title">Total Trips</div>
                <div class="card-value" id="stat-total-trips">-</div>
            </div>
            <div class="card">
                <div class="card-title">Total Participants</div>
                <div class="card-value" id="stat-total-participants">-</div>
            </div>
            <div class="card">
                <div class="card-title">Total Expenses</div>
                <div class="card-value" id="stat-total-expenses">-</div>
            </div>
            <div class="card">
                <div class="card-title">Total Settlements</div>
                <div class="card-value" id="stat-total-settlements">-</div>
            </div>
        </div>

        <div class="card-grid">
            <div class="card" style="grid-column: span 2;">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="page-title" style="font-size: 1.25rem;">Recent Trips</h2>
                    <a href="trips.html" class="btn btn-secondary btn-sm">View All</a>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Trip Name</th>
                                <th>Destination</th>
                                <th>Type</th>
                                <th>Budget</th>
                            </tr>
                        </thead>
                        <tbody id="recent-trips-table">
                            <tr><td colspan="4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
