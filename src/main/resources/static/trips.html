<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trips - TripSplit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-content">
        <div class="page-header">
            <button class="mobile-menu-btn">☰</button>
            <h1 class="page-title">Trips</h1>
            <button class="btn btn-primary" onclick="openCreateModal()">+ Create Trip</button>
        </div>

        <div id="trips-container" class="card-grid">
            <!-- Loading State -->
            <div class="card"><div class="card-title">Loading trips...</div></div>
        </div>
    </div>

    <!-- Create/Edit Trip Modal -->
    <div class="modal-overlay" id="trip-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="trip-modal-title">Create Trip</div>
                <button class="modal-close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="trip-form">
                    <input type="hidden" id="trip-id">
                    <div class="form-group">
                        <label class="form-label">Trip Name *</label>
                        <input type="text" id="trip-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Destination *</label>
                        <input type="text" id="trip-destination" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Trip Type</label>
                        <input type="text" id="trip-type" class="form-control" placeholder="e.g. Vacation, Business">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Budget *</label>
                        <input type="number" id="trip-budget" class="form-control" min="0" step="0.01" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="save-trip-btn" onclick="saveTrip()">Save Trip</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/trips.js"></script>
</body>
</html>
